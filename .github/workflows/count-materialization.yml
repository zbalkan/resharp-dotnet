name: Count materialization experiment

on:
  push:
    branches:
      - perf/count-without-materialization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: count-materialization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10.0.102
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.102"

      - name: Pin benchmark SDK
        shell: bash
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "10.0.102",
              "rollForward": "disable"
            }
          }
          EOF
          test "$(dotnet --version)" = "10.0.102"

      - name: Restore
        run: dotnet restore src/Resharp.Benchmarks/Resharp.Benchmarks.csproj

      - name: Test
        run: dotnet test src/Resharp.Test/Resharp.Test.fsproj -c Release -f net10.0

      - name: Build benchmarks
        run: dotnet build src/Resharp.Benchmarks/Resharp.Benchmarks.csproj -c Release -f net10.0 --no-restore

      - name: Benchmark original vs direct Count
        working-directory: src/Resharp.Benchmarks
        shell: bash
        run: |
          mkdir -p BenchmarkDotNet.Artifacts
          set -o pipefail
          dotnet run -c Release -f net10.0 --no-build -- --count-materialization \
            2>&1 | tee BenchmarkDotNet.Artifacts/ci-console.log

      - name: Validate benchmark results
        shell: bash
        run: |
          log=src/Resharp.Benchmarks/BenchmarkDotNet.Artifacts/ci-console.log
          csv=src/Resharp.Benchmarks/BenchmarkDotNet.Artifacts/results/Resharp.Benchmarks.CountMaterializationBench-report.csv

          test -s "${csv}"
          grep -Fq "Original" "${csv}"
          grep -Fq "Direct" "${csv}"

          if grep -Fq "There are not any results runs" "${log}" \
            || grep -Fq "No Workload Results were obtained" "${log}" \
            || grep -Fq "Benchmarks with issues:" "${log}"; then
            echo "::error::BenchmarkDotNet completed without valid workload results."
            exit 1
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: count-materialization-${{ github.run_id }}-${{ github.sha }}
          path: src/Resharp.Benchmarks/BenchmarkDotNet.Artifacts/**
          if-no-files-found: warn
          retention-days: 30
